<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>万科双语学校 · 六年级开放日选课</title>
<style>
  :root{
    --primary:#3a6ea5; --primary-dark:#2c5580; --primary-light:#e8f1fa;
    --green:#3a9e6e; --green-light:#e6f5ee;
    --orange:#e8833a; --orange-light:#fdf0e5;
    --red:#d9534f; --red-light:#fbeaea;
    --text:#333; --text-sub:#888; --line:#eee; --bg:#f4f6f8; --card:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px}
  .page{max-width:480px;margin:0 auto;min-height:100vh}

  /* 顶部 */
  .header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:22px 18px 18px;border-radius:0 0 18px 18px;position:relative}
  .header h1{font-size:19px;font-weight:600;letter-spacing:.5px}
  .header .sub{font-size:12px;opacity:.85;margin-top:6px}
  .header .rule{margin-top:10px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.7}
  .live{position:absolute;right:16px;top:20px;font-size:10.5px;background:rgba(255,255,255,.18);border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:4px}
  .dot{width:6px;height:6px;border-radius:50%;background:#7ef0a8;box-shadow:0 0 0 0 rgba(126,240,168,.8);animation:pulse 1.8s infinite}
  .dot.off{background:#ffc9c5;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,240,168,.7)}70%{box-shadow:0 0 0 7px rgba(126,240,168,0)}100%{box-shadow:0 0 0 0 rgba(126,240,168,0)}}

  /* 底部标签栏 */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60}
  .tabbar .tab{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:#999;cursor:pointer;position:relative}
  .tabbar .tab .ico{font-size:20px;display:block;margin-bottom:2px}
  .tabbar .tab.active{color:var(--primary)}
  .tabbar .tab .badge{position:absolute;top:4px;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px}

  .content{padding:14px 14px 20px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .banner{background:var(--red-light);color:#b83b37;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;margin-bottom:12px}
  .banner.ok{background:var(--green-light);color:#2f8a5f}
  .banner.warn{background:var(--orange-light);color:#b06a1c}
  .banner code{background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;font-size:11px}

  /* 时段 */
  .period-head{display:flex;align-items:center;gap:8px;margin:16px 2px 8px}
  .period-tag{background:var(--primary);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}
  .period-name{font-size:14px;font-weight:600;color:#555}
  .period-note{font-size:11px;color:var(--text-sub);margin-left:auto}
  .break-line{text-align:center;color:#bbb;font-size:11px;margin:12px 0;letter-spacing:2px}

  /* 课程卡片 */
  .course{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff;transition:.2s}
  .course.selected{border-color:var(--green);background:var(--green-light)}
  .course.disabled{opacity:.55;background:#fafafa}
  .course .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .subject{font-size:15px;font-weight:600}
  .tag{font-size:10px;border-radius:4px;padding:2px 6px;font-weight:500}
  .tag.eng{background:#e3ecfb;color:#3a6ea5}
  .tag.math{background:#fdf0e5;color:#c96a1d}
  .tag.cls{background:#e6f5ee;color:#2f8a5f}
  .tag.full{background:var(--red-light);color:var(--red)}
  .course .meta{font-size:12px;color:var(--text-sub);margin-top:5px;line-height:1.6}
  .course .foot{display:flex;align-items:center;margin-top:9px}
  .seat{font-size:11.5px;color:var(--text-sub)}
  .seat b{color:var(--orange)}
  .btn{margin-left:auto;border:none;border-radius:16px;padding:6px 16px;font-size:12.5px;cursor:pointer;font-weight:500;font-family:inherit}
  .btn-pick{background:var(--primary);color:#fff}
  .btn-pick:active{background:var(--primary-dark)}
  .btn-cancel{background:#fff;color:var(--green);border:1px solid var(--green)}
  .btn-off{background:#e5e5e5;color:#999;cursor:not-allowed}
  .reason{font-size:11px;color:var(--red);margin-left:auto}

  /* 表单 */
  .form-item{margin-bottom:13px}
  .form-item label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:500}
  .form-item label .req{color:var(--red);margin-left:2px}
  .form-item label .opt{color:#aaa;font-size:11px;font-weight:400;margin-left:4px}
  .form-item input,.form-item select{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px 12px;font-size:14px;background:#fafbfc;outline:none;font-family:inherit}
  .form-item input:focus,.form-item select:focus{border-color:var(--primary);background:#fff}
  .tip{font-size:11px;color:var(--text-sub);margin-top:4px;line-height:1.6}
  .btn-main{width:100%;border:none;border-radius:22px;padding:12px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;cursor:pointer;margin-top:4px;font-family:inherit}
  .btn-main:active{background:var(--primary-dark)}
  .btn-main[disabled]{background:#c8d3de;cursor:not-allowed}
  .btn-ghost{width:100%;border:1px solid #ddd;border-radius:22px;padding:10px;font-size:13px;background:#fff;color:#777;cursor:pointer;margin-top:10px;font-family:inherit}

  /* 我的 */
  .me-head{display:flex;align-items:center;gap:12px}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .me-info .name{font-size:16px;font-weight:600}
  .me-info .cls{font-size:12px;color:var(--text-sub);margin-top:3px}
  .lvl{display:inline-block;font-size:10.5px;background:var(--orange-light);color:var(--orange);border-radius:4px;padding:2px 6px;margin-right:4px;margin-top:4px}
  .quota{margin-left:auto;text-align:center}
  .quota .num{font-size:22px;font-weight:700;color:var(--primary)}
  .quota .num i{font-style:normal;font-size:12px;color:var(--text-sub)}
  .quota .lbl{font-size:11px;color:var(--text-sub)}
  .my-item{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:11px 2px}
  .my-item:last-child{border-bottom:none}
  .my-item .info{flex:1}
  .my-item .t{font-size:14px;font-weight:600}
  .my-item .d{font-size:11.5px;color:var(--text-sub);margin-top:3px}

  /* 提交条 */
  .submitbar{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:55;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
  .submitbar .txt{font-size:12px;color:var(--text-sub);line-height:1.4}
  .submitbar .txt b{color:var(--primary);font-size:15px}
  .submitbar .btn-main{width:auto;padding:10px 22px;margin:0;flex-shrink:0}

  /* 管理 */
  .admin-row{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:10px 2px;font-size:13px}
  .admin-row:last-child{border-bottom:none}
  .admin-row .s{flex:1;min-width:0}
  .admin-row .s .a{font-weight:600;font-size:13px}
  .admin-row .s .b{font-size:11px;color:var(--text-sub);margin-top:2px}
  .cnt{font-size:13px;font-weight:700;margin-right:10px}
  .cnt.ok{color:var(--green)} .cnt.warn{color:var(--orange)} .cnt.full{color:var(--red)}
  .names{font-size:11px;color:#777;line-height:1.8;margin:4px 0 8px;padding:8px 10px;background:#fafbfc;border-radius:8px}
  .sec-title{font-size:13.5px;font-weight:600;color:#555;margin:4px 2px 8px;display:flex;align-items:center;gap:8px}
  .sec-title .mini{margin-left:auto;font-size:11px;color:var(--primary);font-weight:400}
  .stats{display:flex;gap:10px}
  .stat{flex:1;background:var(--primary-light);border-radius:12px;padding:12px 10px;text-align:center}
  .stat .n{font-size:22px;font-weight:700;color:var(--primary)}
  .stat .l{font-size:11px;color:#6a86a4;margin-top:3px}
  .btn-sm{border:none;border-radius:14px;padding:7px 14px;font-size:12px;cursor:pointer;background:var(--primary);color:#fff;font-family:inherit}
  .btn-sm.gray{background:#eef1f4;color:#5c6b7a}
  .btn-sm.red{background:var(--red-light);color:var(--red)}
  .btn-del{border:none;background:transparent;color:var(--red);font-size:11.5px;padding:6px 8px;cursor:pointer;flex-shrink:0;font-family:inherit}
  .row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rec{border-bottom:1px solid var(--line);padding:10px 2px;display:flex;align-items:flex-start;gap:8px}
  .rec:last-child{border-bottom:none}
  .rec .k{font-size:13px;font-weight:600}
  .rec .k .c{font-size:10.5px;background:var(--green-light);color:#2f8a5f;border-radius:4px;padding:2px 6px;margin-left:6px;font-weight:500}
  .rec .v{font-size:11px;color:var(--text-sub);margin-top:3px;line-height:1.7}
  .empty{text-align:center;color:#bbb;font-size:13px;padding:26px 0}

  /* toast & modal */
  .toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13.5px;padding:12px 22px;border-radius:10px;z-index:200;display:none;max-width:80%;text-align:center;line-height:1.6}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:20px 18px 16px;text-align:center;max-height:86vh;overflow:auto}
  .modal h3{font-size:16px;margin-bottom:8px}
  .modal p{font-size:13px;color:#666;line-height:1.7;margin-bottom:14px;text-align:left;white-space:pre-wrap;word-break:break-word}
  .modal input{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:14px;outline:none;font-family:inherit}
  .modal .btns{display:flex;gap:10px}
  .modal .btns button{flex:1;border:none;border-radius:20px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit}
  .modal .btns .cancel{background:#f0f2f5;color:#666}
  .modal .btns .ok{background:var(--primary);color:#fff}
  .modal .btns .ok.danger{background:var(--red)}
  .modal .btns .ok[disabled]{background:#d5dae0;cursor:not-allowed}

  /* 回执 */
  .receipt{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:18px 16px 14px;text-align:left;max-height:88vh;overflow:auto}
  .receipt .rh{text-align:center;padding-bottom:12px;border-bottom:1px dashed #dde3e9}
  .receipt .ricon{font-size:34px;line-height:1.2}
  .receipt .rtitle{font-size:17px;font-weight:700;margin-top:4px}
  .receipt .rtitle.ok{color:var(--green)} .receipt .rtitle.no{color:var(--red)}
  .receipt .rno{font-size:11px;color:#8b98a5;margin-top:5px;letter-spacing:.4px}
  .receipt .rbody{padding:12px 0 6px;font-size:13px;line-height:1.85}
  .receipt .row{display:flex;gap:8px}
  .receipt .row .k{color:#8b98a5;width:64px;flex-shrink:0}
  .receipt .row .v{flex:1;word-break:break-word}
  .receipt .clist{margin:8px 0 4px;border-top:1px solid var(--line);padding-top:8px}
  .receipt .c{margin-bottom:7px}
  .receipt .c .n{font-weight:600}
  .receipt .c .d{font-size:11.5px;color:#8b98a5;margin-top:2px}
  .receipt .note{margin-top:10px;background:var(--orange-light);color:#a8621a;font-size:11.5px;line-height:1.7;border-radius:9px;padding:9px 10px}
  .receipt .rfoot{display:flex;gap:10px;margin-top:12px}
  .receipt .rfoot button{flex:1;border:none;border-radius:20px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit}
  .receipt .rfoot .ghost{background:#f0f2f5;color:#666}
  .receipt .rfoot .main{background:var(--primary);color:#fff}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #d5dae0;border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>万科双语学校 · 六年级开放日</h1>
    <div class="sub">2026年11月20日（周五） · 家长开放日选课系统</div>
    <div class="live" id="live"><span class="dot" id="liveDot"></span><span id="liveTxt">连接中</span></div>
    <div class="rule">
      📌 选课须知：每个家庭限 1 名家长代表参加；每位家长限选 <b>2</b> 节课；每节课限 <b>8</b> 名家长。<br>
      班级课程（语文 / CCE / 赛艇 / STEM / 体育 / G-Science）仅限本班家长选择；英语、数学请按孩子所在层次选择对应课堂。
    </div>
  </div>

  <div class="content" id="content"></div>

  <div id="submitbar"></div>

  <div class="tabbar">
    <div class="tab active" data-tab="pick"><span class="ico">📚</span>选课</div>
    <div class="tab" data-tab="me"><span class="ico">🙋</span>我的<span class="badge" id="meBadge" style="display:none">0</span></div>
    <div class="tab" data-tab="admin"><span class="ico">📊</span>管理</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   一、配置区
   ===================================================================== */
const DB_URL   = 'https://vkbs-2026-g6-open-day-default-rtdb.asia-southeast1.firebasedatabase.app';
const DB_PATH  = '/registrations';   // 数据根节点
const ADMIN_NODE = '/admins';        // 管理员 UID 白名单节点（只读，控制台维护）

/* Firebase Web API Key：项目设置 → 通用 → 你的应用 → Web API Key
   留空时，首次打开页面可在「管理」页粘贴一次，之后永久保存在本机 */
const API_KEY_DEFAULT = '';
/* 管理员账号：控制台 Authentication 里建好的邮箱账号（可只填 @ 前的部分） */
const ADMIN_EMAIL      = 'admin@vkbs.edu';
const ADMIN_EMAIL_DOMAIN = 'vkbs.edu';

const CAPACITY = 8;   // 每节课限 8 名家长
const MAX_PICK = 2;   // 每位家长限选 2 节
const SCHOOL_NAME = '万科双语学校六年级（2026 开放日）';

const PERIODS = ['P1','P2','P3','P4'];
const PERIOD_NAME = {P1:'第 1 节课', P2:'第 2 节课', P3:'第 3 节课', P4:'第 4 节课'};
const CLASSES = ['6-1','6-2','6-3','6-4','6-5'];

/* 课表数据（来源：家长开放日课表截图）
 * type : 'eng' 英语 | 'math' 数学 | 'cls' 班级课
 * level: 该课堂对应的层次（用于展示，课名中已体现）
 * grp  : 英语/数学课堂开放给哪些班级（按课表分组，非全年级混班）
 * cls  : 班级课所属班级
 * room : "TBD" = 原表 "find a bigger room than G20"
 */
const SESSIONS = [
  // ---------- P1 ----------
  {id:'e1', period:'P1', type:'eng', name:'英语 · H 层 (A)',  level:'H',   teacher:'Arné Engelbrecht', room:'TBD（大于G20的教室）', grp:['6-1','6-2','6-3']},
  {id:'e2', period:'P1', type:'eng', name:'英语 · S1 层 (A)', level:'S1',  teacher:'Sarah Harkin',      room:'208', grp:['6-1','6-2','6-3']},
  {id:'e3', period:'P1', type:'eng', name:'英语 · S1 层 (B)', level:'S1',  teacher:'Lauren Berry',      room:'207', grp:['6-1','6-2','6-3']},
  {id:'e4', period:'P1', type:'eng', name:'英语 · ESL 层 (A)',level:'ESL', teacher:'Calum Carey',       room:'206', grp:['6-1','6-2','6-3']},
  {id:'m1', period:'P1', type:'math', name:'数学 Math', level:'何春莉老师组', teacher:'何春莉 Ms. Cathy He', room:'209', grp:['6-4','6-5']},
  {id:'m2', period:'P1', type:'math', name:'数学 Math', level:'涂恋恋老师组', teacher:'涂恋恋 Ms. Tu',       room:'210', grp:['6-4','6-5']},
  // ---------- P2 ----------
  {id:'m3', period:'P2', type:'math', name:'数学 Math', level:'秦秦睿老师组', teacher:'秦秦睿 Ms. Katie Qin', room:'206', grp:['6-1','6-2','6-3']},
  {id:'m4', period:'P2', type:'math', name:'数学 Math', level:'白文炜老师组', teacher:'白文炜 Ms. Bai',       room:'207', grp:['6-1','6-2','6-3']},
  {id:'m5', period:'P2', type:'math', name:'数学 Math', level:'涂恋恋老师组', teacher:'涂恋恋 Ms. Tu',        room:'208', grp:['6-1','6-2','6-3']},
  {id:'g1', period:'P2', type:'cls', name:'G-Science', teacher:'James Stewart', room:'209', cls:'6-4'},
  {id:'g2', period:'P2', type:'cls', name:'G-Science', teacher:'Mr.P',          room:'210', cls:'6-5'},
  // ---------- P3 ----------
  {id:'c11', period:'P3', type:'cls', name:'语文 Chinese', teacher:'汪颖 Ms. Wang Ying', room:'206', cls:'6-1'},
  {id:'c21', period:'P3', type:'cls', name:'CCE',          teacher:'Mohammed Tenil',    room:'207', cls:'6-2'},
  {id:'c31', period:'P3', type:'cls', name:'赛艇 Rowing',  teacher:'赛艇教练团队',        room:'户外·码头', cls:'6-3'},
  {id:'c41', period:'P3', type:'cls', name:'STEM',         teacher:'Miguel Carrasquel', room:'STEM Room', cls:'6-4'},
  {id:'c51', period:'P3', type:'cls', name:'语文 Chinese', teacher:'顾江溪 Ms. Gu',      room:'210', cls:'6-5'},
  // ---------- P4 ----------
  {id:'c12', period:'P4', type:'cls', name:'体育 PE',      teacher:'高亚飞',             room:'操场', cls:'6-1'},
  {id:'c22', period:'P4', type:'cls', name:'STEM',         teacher:'Miguel Carrasquel', room:'STEM Room', cls:'6-2'},
  {id:'c32', period:'P4', type:'cls', name:'语文 Chinese', teacher:'曹丽妮 Ms. Cao',     room:'208', cls:'6-3'},
  {id:'e5', period:'P4', type:'eng', name:'英语 · H 层 (B)',   level:'H',   teacher:'Arné Engelbrecht', room:'TBD（大于G20的教室）', grp:['6-4','6-5']},
  {id:'e6', period:'P4', type:'eng', name:'英语 · S 层 (C)',   level:'S',   teacher:'Sarah Harkin',     room:'210', grp:['6-4','6-5']},
  {id:'e7', period:'P4', type:'eng', name:'英语 · ESL 层 (B)', level:'ESL', teacher:'Calum Carey',      room:'209', grp:['6-4','6-5']},
];
const sessionById = id => SESSIONS.find(s => s.id === id);

/* =====================================================================
   二、本地存储
   ===================================================================== */
const LS = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
  del(k){ localStorage.removeItem(k); }
};
const K_ME = 'vkbs_g6_me', K_PICKS = 'vkbs_g6_picks', K_KEY = 'vkbs_g6_key';
const K_AUTH = 'vkbs_g6_auth', K_APIKEY = 'vkbs_g6_apikey', K_RCPT = 'vkbs_g6_receipt';

/* =====================================================================
   三、身份认证（方案 B：家长匿名登录 + 管理员邮箱密码）
   ===================================================================== */
const apiKey = () => LS.get(K_APIKEY, '') || API_KEY_DEFAULT;
const AUTH = { uid:null, idToken:null, refreshToken:null, exp:0, isAdmin:false };
let authState = 'idle';   // idle | ready | nokey | error

function postJson(url, body){
  return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(async r => {
      const j = await r.json().catch(() => ({}));
      if(j.error) throw new Error(authErrMsg(j.error.message));
      return j;
    });
}
function authErrMsg(code){
  const c = String(code || '');
  if(c.includes('API key not valid') || c.includes('API_KEY_INVALID')) return 'Web API Key 无效，请检查配置';
  if(c.includes('OPERATION_NOT_ALLOWED') || c.includes('ADMIN_ONLY_OPERATION')) return '匿名登录未启用，请在 Firebase 控制台启用「匿名」登录方式';
  if(c.includes('EMAIL_NOT_FOUND') || c.includes('INVALID_PASSWORD') || c.includes('INVALID_LOGIN_CREDENTIALS')) return '账号或密码错误';
  if(c.includes('TOO_MANY_ATTEMPTS_TRY_LATER')) return '尝试过于频繁，请稍后再试';
  if(c.includes('USER_DISABLED')) return '该账号已被停用';
  return '认证失败：' + c;
}
function setAuth(j, isAdmin){
  AUTH.uid          = j.localId || j.user_id;
  AUTH.idToken      = j.idToken || j.id_token;
  AUTH.refreshToken = j.refreshToken || j.refresh_token;
  AUTH.exp          = Date.now() + (+(j.expiresIn || j.expires_in || 3600)) * 1000 - 60000;
  AUTH.isAdmin      = !!isAdmin;
  LS.set(K_AUTH, { uid:AUTH.uid, refreshToken:AUTH.refreshToken, isAdmin:AUTH.isAdmin });
  authState = 'ready';
}
/* 匿名登录（家长端，静默执行） */
async function anonSignIn(){
  const j = await postJson('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + apiKey(), { returnSecureToken:true });
  setAuth(j, false);
  return AUTH;
}
/* 管理员登录 */
async function adminSignIn(account, password){
  const email = account.includes('@') ? account : (account + '@' + ADMIN_EMAIL_DOMAIN);
  const j = await postJson('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + apiKey(),
    { email, password, returnSecureToken:true });
  setAuth(j, true);
  return AUTH;
}
/* 用 refreshToken 换取新的 idToken（ID Token 有效期 1 小时） */
async function refreshIdToken(){
  const body = new URLSearchParams({ grant_type:'refresh_token', refresh_token:AUTH.refreshToken });
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + apiKey(),
    { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
  const j = await r.json().catch(() => ({}));
  if(j.error) throw new Error(authErrMsg(j.error.message));
  setAuth(j, AUTH.isAdmin);
}
/* 页面初始化：恢复会话或新建匿名身份 */
async function authInit(){
  if(!apiKey()){ authState = 'nokey'; paintLive(); return; }
  const saved = LS.get(K_AUTH, null);
  try{
    if(saved && saved.refreshToken && !saved.isAdmin){   // 管理员会话不自动恢复，需重新登录
      AUTH.uid = saved.uid; AUTH.refreshToken = saved.refreshToken;
      await refreshIdToken(); authState = 'ready';
    }else{
      await anonSignIn();
    }
  }catch(e){
    try{ await anonSignIn(); }catch(e2){ authState = 'error'; paintLive(); toast(e2.message || '身份初始化失败'); return; }
  }
  paintLive();
}
/* 写操作前确保 token 有效 */
async function ensureAuth(){
  if(!apiKey()) throw new Error('尚未配置 Web API Key，无法连接数据库');
  if(!AUTH.uid){ await authInit(); }
  if(!AUTH.idToken || Date.now() > AUTH.exp){ await refreshIdToken(); }
  return AUTH.idToken;
}

/* =====================================================================
   四、云端数据库（Realtime Database REST，所有请求带 ?auth=ID Token）
   ===================================================================== */
let REG = [];                 // 全部登记记录
let dbState = 'connecting';   // connecting | live | error | denied | nokey

async function api(method, path, body, retry){
  if(!apiKey()){ dbState = 'nokey'; paintLive(); throw new Error('尚未配置 Web API Key'); }
  if(!AUTH.idToken) await authInit();
  const url = DB_URL + path + '.json?auth=' + encodeURIComponent(AUTH.idToken);
  const opt = { method, headers:{ 'Content-Type':'application/json' } };
  if(body !== undefined) opt.body = JSON.stringify(body);

  let res;
  try{ res = await fetch(url, opt); }
  catch(e){ dbState = 'error'; paintLive(); throw new Error('网络连接失败，请检查网络后重试'); }

  if(res.status === 401 || res.status === 403){
    if(!retry){                 // token 可能过期：刷新后重试一次
      try{ await refreshIdToken(); return api(method, path, body, true); }catch(e){}
    }
    dbState = 'denied'; paintLive();
    throw new Error(AUTH.isAdmin
      ? '数据库拒绝访问：请确认该管理员 UID 已加入 /admins 白名单'
      : '数据库拒绝访问：可能是登录状态失效，请刷新页面重试');
  }
  if(!res.ok){ dbState = 'error'; paintLive(); throw new Error('请求失败（HTTP ' + res.status + '）'); }
  dbState = 'live'; paintLive();
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const fetchAll  = () => api('GET', DB_PATH);
const pushRec   = (rec) => api('POST', DB_PATH, rec);
const putRec    = (key, rec) => api('PUT', DB_PATH + '/' + key, rec);
const deleteRec = (key) => api('DELETE', DB_PATH + '/' + key);
const deleteAll = () => api('DELETE', DB_PATH);

function applyRemote(data){
  REG = Object.entries(data || {}).map(([key, v]) => Object.assign({key}, v));
  render();
}
async function refresh(){
  if(!apiKey() || !AUTH.idToken) return;
  try{ applyRemote(await fetchAll()); }catch(e){ /* 状态已记录 */ }
}
/* 实时推送：Firebase REST 的 SSE 流（失败自动降级为轮询） */
let ES = null;
function startRealtime(){
  paintLive();
  if(ES){ try{ ES.close(); }catch(e){} ES = null; }
  if(window.EventSource && apiKey() && AUTH.idToken){
    try{
      ES = new EventSource(DB_URL + DB_PATH + '.json?auth=' + encodeURIComponent(AUTH.idToken));
      ES.addEventListener('put', e => {
        const m = JSON.parse(e.data);
        if(m.path === '/'){ applyRemote(m.data); }
        else if(m.data === null){
          const k = m.path.slice(1).split('/')[0];
          REG = REG.filter(r => r.key !== k); render();
        }else if(m.data){
          const k = m.path.slice(1).split('/')[0];
          const i = REG.findIndex(r => r.key === k);
          const rec = Object.assign({key:k}, m.data);
          if(i > -1) REG[i] = rec; else REG.push(rec);
          render();
        }
        dbState = 'live'; paintLive();
      });
      ES.onerror = () => { try{ ES.close(); }catch(e){} ES = null; };
    }catch(e){}
  }
  refresh();
  if(!window.__vkbsTimer) window.__vkbsTimer = setInterval(() => refresh(), 20000);  // 兜底轮询
  if(!window.__vkbsVis){
    window.__vkbsVis = true;
    document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
  }
}
function paintLive(){
  const dot = $('#liveDot'), txt = $('#liveTxt');
  if(!dot) return;
  if(authState === 'nokey' || dbState === 'nokey'){ dot.className = 'dot off'; txt.textContent = '待配置密钥'; return; }
  if(dbState === 'live'){ dot.className = 'dot'; txt.textContent = AUTH.isAdmin ? '管理员模式' : '实时同步中'; return; }
  if(dbState === 'denied'){ dot.className = 'dot off'; txt.textContent = '无访问权限'; return; }
  if(dbState === 'error'){ dot.className = 'dot off'; txt.textContent = '连接异常'; return; }
  txt.textContent = '连接中';
}

/* =====================================================================
   五、页面状态
   ===================================================================== */
let me      = LS.get(K_ME, null);       // {cls, cn, en, phone}
let picks   = LS.get(K_PICKS, []);      // ['e2','c11']
let myKey   = LS.get(K_KEY, null);      // 已提交记录在数据库中的 key
let tab     = 'pick';                   // pick | me | admin
let editing = false;                    // 是否处于「修改已提交选课」状态
let adminIn = sessionStorage.getItem('vkbs_g6_admin') === '1';
let submitting = false;                 // 防止重复提交

const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ts => ts ? new Date(ts).toLocaleString('zh-CN', {hour12:false}) : '';
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200);
}
const takenCount = id => REG.filter(r => (r.picks || []).includes(id)).length;
const seatsLeft  = id => Math.max(0, CAPACITY - takenCount(id));
const myRecord   = () => REG.find(r => r.key === myKey) || null;
const receiptNo  = key => 'VKBS-' + String(key || Date.now()).replace(/[^A-Za-z0-9]/g, '').slice(-6).toUpperCase();

/* =====================================================================
   六、选课资格（按课表分组）
   ===================================================================== */
function checkEligible(s, cls){
  if(s.type === 'cls') return s.cls === cls ? '' : '仅限 ' + s.cls + ' 班';
  return (s.grp || []).includes(cls) ? '' : '该课堂不对 ' + cls + ' 班开放';
}

/* =====================================================================
   七、渲染
   ===================================================================== */
function render(){
  const badge = $('#meBadge');
  const rec = myRecord();
  const n = rec ? (rec.picks || []).length : (me ? picks.length : 0);
  badge.style.display = n ? 'block' : 'none'; badge.textContent = n;

  if(tab === 'me')    return renderMe();
  if(tab === 'admin') return renderAdmin();
  if(!me)             return renderForm();
  return renderPick();
}

/* ---------- 信息登记 ---------- */
function renderForm(){
  $('#submitbar').innerHTML = '';
  $('#content').innerHTML = `
  ${keyBanner()}
  <div class="card">
    <div class="sec-title">📝 学生信息登记</div>
    <div class="tip" style="margin-bottom:12px">每个家庭限 1 名家长代表参加开放日，请填写学生信息后开始选课。</div>
    <div class="form-item"><label>班级<span class="req">*</span></label>
      <select id="fCls">
        <option value="">请选择班级</option>
        ${CLASSES.map(c => `<option ${me && me.cls === c ? 'selected' : ''}>${c}</option>`).join('')}
      </select></div>
    <div class="form-item"><label>学生中文姓名<span class="req">*</span></label>
      <input id="fCn" placeholder="请输入中文姓名" value="${me ? esc(me.cn) : ''}"></div>
    <div class="form-item"><label>学生英文名<span class="opt">（选填）</span></label>
      <input id="fEn" placeholder="English name" value="${me ? esc(me.en || '') : ''}"></div>
    <div class="form-item"><label>家长手机号<span class="req">*</span></label>
      <input id="fPhone" type="tel" maxlength="11" inputmode="numeric" placeholder="请输入 11 位手机号" value="${me ? esc(me.phone || '') : ''}">
      <div class="tip">用于确认家庭身份，每个家庭仅需 1 位家长代表填写</div></div>
    <button class="btn-main" onclick="saveMe()">下一步：选择课程</button>
  </div>`;
}
function keyBanner(){
  if(apiKey()) return '';
  return `<div class="banner">🔧 尚未配置 Firebase Web API Key，暂时无法连接报名数据库。请到「管理」页粘贴一次密钥（只需一次，本机会记住）。</div>`;
}
function saveMe(){
  const cls = $('#fCls').value.trim(), cn = $('#fCn').value.trim(),
        en = $('#fEn').value.trim(), phone = $('#fPhone').value.trim();
  if(!cls)          return toast('请选择班级');
  if(!cn)           return toast('请填写学生中文姓名');
  if(!/^1[3-9]\d{9}$/.test(phone)) return toast('请填写正确的 11 位手机号');
  const dup = REG.find(r => r.phone === phone || (r.cls === cls && r.cn === cn));
  if(dup && dup.key !== myKey)
    return toast('该学生已有家长提交过选课（' + dup.cn + '），每个家庭限 1 名家长代表，如需调整请联系班主任');
  me = {cls, cn, en, phone}; LS.set(K_ME, me);
  toast('信息已保存'); render();
}

/* ---------- 选课 ---------- */
function renderPick(){
  const rec = myRecord();
  const useLocal = !rec || editing;
  const chosen = useLocal ? picks : (rec.picks || []);
  const chosenPeriods = chosen.map(id => (sessionById(id) || {}).period);
  let html = keyBanner();

  if(authState === 'error' || dbState === 'denied'){
    html += `<div class="banner">⚠️ 无法访问报名数据库。请确认：① 已在控制台启用「匿名」登录；② 已发布方案 B 的安全规则；③ 网络正常。错误：${esc(dbState === 'denied' ? '权限被拒绝' : '身份初始化失败')}</div>`;
  }else if(dbState === 'error'){
    html += `<div class="banner warn">⚠️ 云端连接异常，名额可能不是最新的，请稍后重试。</div>`;
  }
  if(rec && !editing){
    html += `<div class="banner ok">✅ 您已于 ${fmtTime(rec.ts)} 提交选课（回执编号 ${receiptNo(rec.key)}）。可在「我的」页查看回执或修改选课。</div>`;
  }else if(editing){
    html += `<div class="banner warn">✏️ 正在修改已提交的选课，重新提交后将覆盖原记录，请留意新回执。</div>`;
  }

  PERIODS.forEach(pd => {
    if(pd === 'P3') html += '<div class="break-line">— · 课间休息 Break · —</div>';
    const chosenHere = chosenPeriods.includes(pd);
    html += `<div class="period-head"><span class="period-tag">${pd}</span>
      <span class="period-name">${PERIOD_NAME[pd]}</span>
      <span class="period-note">${chosenHere ? '✔ 本时段已选' : ''}</span></div>`;

    SESSIONS.filter(s => s.period === pd).forEach(s => {
      const left = seatsLeft(s.id), full = left <= 0;
      const picked = chosen.includes(s.id);
      const reason = picked ? '' : checkEligible(s, me.cls);
      const fullUp = !picked && useLocal && chosen.length >= MAX_PICK;
      const conflict = !picked && chosenHere && useLocal;
      const dis = !picked && (full || reason || fullUp || conflict);
      let btn;
      if(picked)        btn = `<button class="btn btn-cancel" onclick="unpick('${s.id}')">退选</button>`;
      else if(dis){
        const r = full ? '已满员' : (fullUp ? '已达 2 节上限' : (conflict ? '时段冲突' : reason));
        btn = `<span class="reason">${r}</span><button class="btn btn-off" disabled>选课</button>`;
      }else             btn = `<button class="btn btn-pick" onclick="pick('${s.id}')">选课</button>`;

      const tag = s.type === 'eng'  ? `<span class="tag eng">英语 · ${s.level}</span>`
                : s.type === 'math' ? `<span class="tag math">数学 · ${s.level}</span>`
                : `<span class="tag cls">${s.cls} 班</span>`;
      const scope = s.type === 'cls' ? `限 ${s.cls} 班` : `面向 ${(s.grp || []).join(' / ')} 班`;
      html += `
      <div class="course ${picked ? 'selected' : ''} ${dis ? 'disabled' : ''}">
        <div class="top"><span class="subject">${esc(s.name)}</span>${tag}${full ? '<span class="tag full">已满</span>' : ''}</div>
        <div class="meta">👨‍🏫 ${esc(s.teacher)} ｜ 📍 ${esc(s.room)}<br>🏫 ${scope}</div>
        <div class="foot"><span class="seat">剩余名额 <b>${left}</b> / ${CAPACITY}</span>${btn}</div>
      </div>`;
    });
  });
  $('#content').innerHTML = html;

  // 底部提交条
  if(rec && !editing){
    $('#submitbar').innerHTML = `
    <div class="txt">已提交 <b>${chosen.length}</b> 节课<br>回执编号 ${receiptNo(rec.key)}</div>
    <button class="btn-main" style="background:#c8d3de" onclick="viewReceipt()">查看回执</button>`;
  }else{
    $('#submitbar').innerHTML = `
    <div class="txt">已选 <b>${picks.length}</b> / ${MAX_PICK} 节<br>${picks.length ? picks.map(id => esc((sessionById(id) || {}).name)).join('、') : '请选择 1–2 节课'}</div>
    <button class="btn-main" ${picks.length ? '' : 'disabled'} onclick="askSubmit()">${editing ? '重新提交' : '提交选课'}</button>`;
  }
}

function pick(id){
  const s = sessionById(id); if(!s) return;
  if(picks.length >= MAX_PICK) return toast('每位家长最多选 ' + MAX_PICK + ' 节课');
  if(picks.some(p => sessionById(p).period === s.period)) return toast('与已选课程时段冲突（' + PERIOD_NAME[s.period] + '）');
  const r = checkEligible(s, me.cls); if(r) return toast('无法选择：' + r);
  if(seatsLeft(id) <= 0) return toast('该课堂名额已满');
  picks.push(id); LS.set(K_PICKS, picks); render();
}
function unpick(id){
  picks = picks.filter(p => p !== id); LS.set(K_PICKS, picks); render();
}

/* =====================================================================
   八、提交（① 明确确认 → ② 写入数据库 → ③ 回执）
   ===================================================================== */
function askSubmit(){
  if(!me) return renderForm();
  if(!picks.length) return toast('请至少选择 1 节课');
  const list = picks.map(id => {
    const s = sessionById(id);
    return `· ${s.period} ${s.name}\n   ${s.teacher}｜${s.room}`;
  }).join('\n');
  confirmBox({
    title: '请确认选课信息',
    desc: `学生：${me.cn}${me.en ? ' / ' + me.en : ''}（${me.cls} 班）\n家长手机：${me.phone}\n\n已选课程（${picks.length} 节）：\n${list}\n\n点击「确认提交」后将正式录入学校报名系统并占用名额；每个家庭限 1 名家长代表、限选 2 节课。`,
    okText: '确认提交',
    onOk(){ doSubmit(); }
  });
}

async function doSubmit(){
  if(submitting) return;
  submitting = true;
  modal(`<div class="modal"><h3>正在提交…</h3><p style="text-align:center"><span class="spin"></span>正在连接报名系统，请勿关闭页面</p></div>`);
  try{
    await ensureAuth();
    await refresh();                                   // 取最新名额
    for(const id of picks){
      if(seatsLeft(id) <= 0) throw new Error('「' + sessionById(id).name + '」刚刚已满员，请返回重新选择');
    }
    const dup = REG.find(r => r.key !== myKey && (r.phone === me.phone || (r.cls === me.cls && r.cn === me.cn)));
    if(dup) throw new Error('该学生已由家长提交过选课（' + dup.phone + '），每个家庭限 1 名家长代表');

    const rec = {
      cls: me.cls, cn: me.cn, en: me.en || '', phone: me.phone,
      picks: picks.slice(), ts: Date.now(), owner: AUTH.uid
    };
    if(myKey){
      await putRec(myKey, rec);                        // 修改：覆盖自己那条
    }else{
      const r = await pushRec(rec);                    // 首次：新增
      if(r && r.name){ myKey = r.name; LS.set(K_KEY, myKey); }
    }
    editing = false;
    await refresh();
    const saved = myRecord() || Object.assign({key: myKey || 'local'}, rec);
    showReceipt({ ok:true, rec: saved });
  }catch(e){
    showReceipt({ ok:false, rec: {cls:me.cls, cn:me.cn, en:me.en, phone:me.phone, picks:picks.slice(), ts:Date.now()},
                  reason: (e && e.message) || '未知错误' });
  }finally{
    submitting = false;
  }
}

/* =====================================================================
   九、回执（成功 / 失败）
   ===================================================================== */
function receiptHTML(o){
  const r = o.rec || {};
  const no = o.ok ? receiptNo(r.key) : '—';
  const courses = (r.picks || []).map(id => {
    const s = sessionById(id) || {name:id, period:'', teacher:'', room:''};
    return `<div class="c"><div class="n">${esc(s.period)} ${esc(s.name)}</div>
      <div class="d">${esc(s.teacher)} ｜ ${esc(s.room)}</div></div>`;
  }).join('') || '<div class="c"><div class="n">—</div></div>';

  const body = `
    <div class="row"><div class="k">回执编号</div><div class="v"><b>${esc(no)}</b></div></div>
    <div class="row"><div class="k">学生</div><div class="v">${esc(r.cn)}${r.en ? ' / ' + esc(r.en) : ''}</div></div>
    <div class="row"><div class="k">班级</div><div class="v">${esc(r.cls)} 班</div></div>
    <div class="row"><div class="k">家长手机</div><div class="v">${esc(r.phone || '')}</div></div>
    <div class="clist">${courses}</div>
    <div class="row"><div class="k">提交时间</div><div class="v">${fmtTime(r.ts)}</div></div>`;

  const note = o.ok
    ? `📸 请<b>截图保存本回执</b>（含回执编号），开放日当天凭此与签到信息核对。如需修改，请到「我的」页操作并保存新回执。`
    : `❗本次<b>未录入数据库</b>，请根据失败原因调整后重新提交；如多次失败，请截图本页并联系班主任。`;

  return `
  <div class="receipt">
    <div class="rh">
      <div class="ricon">${o.ok ? '✅' : '❌'}</div>
      <div class="rtitle ${o.ok ? 'ok' : 'no'}">${o.ok ? '选课提交成功' : '选课提交失败'}</div>
      <div class="rno">${esc(SCHOOL_NAME)}</div>
    </div>
    ${body}
    ${o.ok ? '' : `<div class="row" style="margin-top:8px"><div class="k">失败原因</div><div class="v" style="color:#d9534f">${esc(o.reason || '')}</div></div>`}
    <div class="note">${note}</div>
    <div class="rfoot">
      <button class="ghost" onclick="copyReceipt()">复制回执文字</button>
      <button class="main" onclick="closeReceipt()">${o.ok ? '完成' : '返回修改'}</button>
    </div>
  </div>`;
}
function showReceipt(o){
  window.__receipt = o;
  modal(receiptHTML(o));
  if(o.ok){
    LS.set(K_RCPT, {key:o.rec.key, ts:o.rec.ts});
    toast('提交成功，请截图保存回执');
    tab = 'me';
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === 'me'));
    render();
  }
}
function closeReceipt(){
  closeModal();
  if(window.__receipt && !window.__receipt.ok){ tab = 'pick'; render(); }
}
function viewReceipt(){
  const rec = myRecord();
  if(!rec) return toast('暂未查询到已提交的记录');
  showReceipt({ ok:true, rec });
}
function copyReceipt(){
  const o = window.__receipt || {}; const r = o.rec || {};
  const lines = [`【${SCHOOL_NAME} · 选课回执】`,
    `状态：${o.ok ? '提交成功' : '提交失败'}`,
    `回执编号：${o.ok ? receiptNo(r.key) : '—'}`,
    `学生：${r.cn || ''}${r.en ? ' / ' + r.en : ''}（${r.cls || ''} 班）`,
    `家长手机：${r.phone || ''}`,
    ...(r.picks || []).map(id => { const s = sessionById(id) || {}; return `课程：${s.period || ''} ${s.name || id}｜${s.teacher || ''}｜${s.room || ''}`; }),
    `提交时间：${fmtTime(r.ts)}`];
  if(!o.ok) lines.push(`失败原因：${o.reason || ''}`);
  const text = lines.join('\n');
  const done = () => toast('回执文字已复制');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('复制失败，请手动截图'); }
  document.body.removeChild(ta);
}

/* =====================================================================
   十一、导出 CSV
   ===================================================================== */
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(rows, filename){
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已导出：' + filename);
}
function exportAll(){
  if(!REG.length) return toast('暂无可导出的数据');
  const rows = [['回执编号','班级','中文姓名','英文名','家长手机号','已选课程','选课数','提交时间']];
  REG.slice().sort((a, b) => String(a.cls).localeCompare(String(b.cls))).forEach(r => {
    const names = (r.picks || []).map(id => {
      const s = sessionById(id) || {name:id, period:''};
      return s.period + ' ' + s.name;
    });
    rows.push([receiptNo(r.key), r.cls, r.cn, r.en || '', r.phone || '', names.join(' / '), names.length, fmtTime(r.ts)]);
  });
  const d = new Date().toISOString().slice(0, 10);
  downloadCSV(rows, '开放日选课名单_' + d + '.csv');
}
function exportBySession(){
  if(!REG.length) return toast('暂无可导出的数据');
  const rows = [['时段','课程','教师','教室','容量','已报人数','家长名单']];
  SESSIONS.forEach(s => {
    const bs = REG.filter(r => (r.picks || []).includes(s.id));
    rows.push([s.period, s.name, s.teacher, s.room, CAPACITY, bs.length,
      bs.map(b => b.cn + '(' + b.cls + '班' + (b.phone ? ' ' + b.phone : '') + ')').join('、')]);
  });
  const d = new Date().toISOString().slice(0, 10);
  downloadCSV(rows, '开放日各课堂名单_' + d + '.csv');
}

/* =====================================================================
   十二、通用弹窗
   ===================================================================== */
function modal(inner){ $('#modalRoot').innerHTML = '<div class="mask">' + inner + '</div>'; }
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function confirmBox({title, desc, okText = '确认', danger = false, needText, inputPlaceholder, onOk}){
  modal(`
    <div class="modal">
      <h3>${esc(title)}</h3>
      <p>${esc(desc).replace(/\n/g, '<br>')}</p>
      ${needText ? `<input id="mbox" placeholder="${esc(inputPlaceholder || '')}">` : ''}
      <div class="btns">
        <button class="cancel" onclick="closeModal()">取消</button>
        <button class="ok ${danger ? 'danger' : ''}" id="mok" ${needText ? 'disabled' : ''}>${esc(okText)}</button>
      </div>
    </div>`);
  const ok = $('#mok'), inp = $('#mbox');
  if(needText && inp){
    inp.addEventListener('input', () => { ok.disabled = inp.value.trim() !== needText; });
    setTimeout(() => inp.focus(), 50);
  }
  ok.addEventListener('click', () => { closeModal(); onOk && onOk(); });
}

   十三、启动

document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {

  if(tab === 'admin' && AUTH.isAdmin) refresh();

}));

  paintLive();

})();
